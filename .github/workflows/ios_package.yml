name: iOS 打包

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（debug / release；debug 用于 Xcode/真机测试）'
        type: choice
        default: release
        options:
          - release
          - debug
      enable_render_probe:
        description: '开启渲染诊断探针（黑屏/渲染排查，含每帧像素采样，见 docs/dev/rendering-diagnosis.md）'
        type: boolean
        default: false
      log_level:
        description: '引擎日志级别（auto=按构建类型：release→info，debug→debug）'
        type: choice
        default: auto
        options:
          - auto
          - trace
          - debug
          - info
          - warn
          - err
          - critical
          - off
      release_version:
        description: '发布版本号（X.Y.Z，如 0.1.4）。会在勾选「发布 Release」时按 ios-vX.Y.Z 打 tag + 建 GitHub Release，并写入原生 app 版本与软件内版本。'
        type: string
        default: ''
      publish_release:
        description: '发布 Release 到 GitHub Releases（需填「发布版本号」）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
      - 'ios-v*'

# 只保留最新一次运行的产物（避免并发互相覆盖缓存）
concurrency:
  group: ios-package
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS (${{ inputs.build_type != '' && inputs.build_type || 'release' }})
    runs-on: macos-15
    timeout-minutes: 240
    # 需要写 contents 才能在勾选「发布 Release」时打 git tag + 建 GitHub Release
    permissions:
      contents: write
    env:
      BUILD_TYPE: ${{ inputs.build_type != '' && inputs.build_type || 'release' }}
      # 渲染诊断探针开关 + 日志级别，透传给 build_ios.sh 的 cmake configure
      ENABLE_RENDER_PROBE: ${{ inputs.enable_render_probe != '' && inputs.enable_render_probe || 'false' }}
      KRKR_LOG_LEVEL: ${{ inputs.log_level != '' && inputs.log_level || 'auto' }}
      # 发布版本号 + 是否发布 Release，透传进 build_ios.sh 与发布步骤
      RELEASE_VERSION: ${{ inputs.release_version != '' && inputs.release_version || '' }}
      PUBLISH_RELEASE: ${{ inputs.publish_release != '' && inputs.publish_release || 'false' }}
      # 并行构建数
      JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        # 提前校验，避免填了发布却没填版本号空等 30 分钟编译
        if: ${{ inputs.publish_release }}
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "::error::勾选了「发布 Release」但没填写「发布版本号」；请填 X.Y.Z（如 0.1.4）再运行"
            exit 1
          fi
          if [[ "$RELEASE_VERSION" != *.*.* || "$RELEASE_VERSION" != [0-9]*.*.* ]]
          then
            echo "::error::发布版本号需为 X.Y.Z 三段式（如 0.1.4）；当前：$RELEASE_VERSION"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install build dependencies
        # Xcode / CocoaPods / Python 已预装；cmake ninja 幂等安装；bison 用于生成 TJS2 parser
        # autoconf/automake/autoconf-archive/libtool/gettext/pkg-config：
        #   vcpkg 交叉编译 iOS 时需构建宿主工具（gperf→glib、libexif 等 autotools 端口）
        # ccache：引擎 C++ 源码增量编译缓存（vcpkg 依赖缓存走下方的 vcpkg 二进制缓存）
        run: |
          brew install cmake ninja bison autoconf automake autoconf-archive libtool gettext pkg-config ccache
          flutter --version
          cmake --version | head -1
          ninja --version

      - name: Restore ccache
        uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Restore vcpkg binary cache
        # vcpkg 二进制缓存：首次全量编译后，后续运行秒级还原依赖
        uses: actions/cache/restore@v4
        id: vcpkg
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Build C++ engine + Flutter iOS app
        run: |
          export VCPKG_BINARY_SOURCES="files,${HOME}/.cache/vcpkg,readwrite"
          export CCACHE_DIR="${HOME}/.cache/ccache"
          # 兜底：Windows 上传/zip 解压易丢失执行位，先确保 build.sh 可执行
          chmod +x build.sh
          ./build.sh ios "$BUILD_TYPE"

      - name: Save ccache
        # build 失败也保存（ccache 内容寻址，已编译对象依然有效），用官方推荐的显式 save
        if: ${{ always() && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}

      - name: Save vcpkg binary cache
        # build 失败也保存（vcpkg 按包增量写入，已编译完的包仍然有效）
        if: ${{ always() && steps.vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}

      - name: Package unsigned .ipa
        run: |
          APP="apps/flutter_app/build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Runner.app not found under $APP"
            find apps/flutter_app/build/ios -maxdepth 3 -name "*.app" 2>/dev/null || true
            exit 1
          fi
          # build.sh ios 本身走 --no-codesign（日志可见 "codesigning disabled"），
          # 这里把未签名的 .app 按标准结构打包成 Payload/xxx.app 的无签名 .ipa，
          # 便于 AltStore / Sideloadly 等侧载工具后续自定义签名安装。
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA="KrKr2-Next-iOS-${BUILD_TYPE}-nosign.ipa"
          zip -qry "$IPA" Payload/
          echo "已生成(未签名): $IPA"
          ls -lh "$IPA"
          echo "artifact=$IPA" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrKr2-Next-iOS-${{ env.BUILD_TYPE }}-nosign
          path: ${{ env.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (iOS)
        # 勾选「发布 Release」且填了版本号时，打 ios-vX.Y.Z tag + 建 GitHub Release + 挂 .ipa
        if: ${{ inputs.publish_release && inputs.release_version != '' }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          TAG="ios-v${VERSION}"
          NOTES=$(printf 'KrKr2 Next iOS 构建，可侧载安装（AltStore / Sideloadly 自定义签名）。\n\n版本：v%s\n产物：%s\n\n> 说明：本包为未签名 .ipa，需自行用 Apple 开发者证书签名后侧载到设备。\n> 版本号标准见仓库 README《版本号 / 发布标准》。' "$VERSION" "$(basename "${{ env.artifact }}")")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # tag 已存在：补充上传产物，不重复建 Release
            echo "Release $TAG 已存在，上传产物：${{ env.artifact }}"
            gh release upload "$TAG" "${{ env.artifact }}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "${{ env.artifact }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KrKr2 Next iOS v${VERSION}" \
              --notes "$NOTES"
          fi
          echo "已发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
